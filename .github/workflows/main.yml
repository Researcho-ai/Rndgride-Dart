name: Copy to New Branch and Build Web

on:
  push:
    branches:
      - flutterflow

jobs:
  copy_to_new_branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Set up Git
        run: |
          git config --global user.email "akash@codots.io"
          git config --global user.name "Codots-io"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.2'

      - name: Run Flutter Doctor
        run: flutter doctor

      - name: Clean Project
        run: flutter clean

      - name: Add Required Dependencies
        run: |
          flutter pub add collection:^1.18.0
          flutter pub add intl:^0.19.0
          flutter pub add carousel_slider:^5.0.0

      - name: Fix CarouselSlider Import Aliasing
        run: |
          echo "🛠 Aliasing CarouselSlider imports to prevent future conflicts"

          # Alias the carousel_slider import if not already aliased
          find lib/ -type f -name '*.dart' -exec grep -q 'package:carousel_slider/carousel_slider.dart' {} \; \
            -exec sed -i 's#import "package:carousel_slider/carousel_slider.dart";#import "package:carousel_slider/carousel_slider.dart" as cs;#g' {} +

          # Safely replace raw usages of Carousel classes with cs. prefix
          find lib/ -type f -name '*.dart' -exec sed -i 's/\([^a-zA-Z0-9_]\)CarouselSlider\([^a-zA-Z0-9_]\)/\1cs.CarouselSlider\2/g' {} +
          find lib/ -type f -name '*.dart' -exec sed -i 's/\([^a-zA-Z0-9_]\)CarouselOptions\([^a-zA-Z0-9_]\)/\1cs.CarouselOptions\2/g' {} +
          find lib/ -type f -name '*.dart' -exec sed -i 's/\([^a-zA-Z0-9_]\)CarouselController\([^a-zA-Z0-9_]\)/\1cs.CarouselController\2/g' {} +

      - name: Patch applyAlpha function in flutter_flow_util.dart
        run: |
          echo "🔧 Patching applyAlpha function to use withOpacity instead of withValue..."
          FILE_PATH="lib/flutterflow/flutter_flow_util.dart"

          if grep -q 'Color applyAlpha(double val) => withValue(val:val);' "$FILE_PATH"; then
            sed -i 's/Color applyAlpha(double val) => withValue(val:val);/Color applyAlpha(double val) => withOpacity(val);/' "$FILE_PATH"
            echo "✅ Patch applied successfully."
          else
            echo "⚠️ Pattern not found or already patched."
          fi

      - name: Build Web
        run: flutter build web --release --web-renderer canvaskit

      - name: Ensure Branch Exists
        run: |
          if git show-ref --verify --quiet refs/heads/researcho_io_main; then
            git checkout researcho_io_main
          else
            git checkout -b researcho_io_main
          fi

      - name: Copy Changes to Branch
        run: |
          git add .
          git commit -m "Fix carousel_slider conflicts and patch applyAlpha; build web"
          git push origin researcho_io_main --force

      - name: Switch Back to Original Branch
        run: git checkout flutterflow
